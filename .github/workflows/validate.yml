name: Validate archived research package
on:
  push:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify input/output inventory
        run: python tools/check_package.py
      - name: Verify source/data integrity
        run: python tools/verify_manifest.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Mathematical invariants
        run: python -m pytest -q tests
